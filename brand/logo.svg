<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="dgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- 圆角方块底 -->
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#bg)"/>
  <!-- 顶部高光 -->
  <ellipse cx="256" cy="120" rx="210" ry="120" fill="#ffffff" opacity="0.08"/>
  <!-- 白色 D 字母 -->
  <path d="M148 148 H200 A124 124 0 1 1 200 364 H148 Z"
        fill="url(#dgrad)"/>
  <!-- 内部高光弧线 -->
  <path d="M212 186 A92 92 0 1 1 212 326"
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
</svg>
